name: Mirror to GitLab

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to fetch all branches and tags for a complete mirror

      - name: Push to GitLab
        env:
          ACCESS_TOKEN: ${{ secrets.KTEST_GITLAB }}
          MIRROR_URL: "gitlab.com/shinhyungyang/ktest.git"
        run: |
          # Add the GitLab remote using the oauth2 user and your access token
          git remote add mirror https://oauth2:${ACCESS_TOKEN}@${MIRROR_URL}
          
          # Force push all branches and tags to the GitLab repository
          git push mirror main --force
